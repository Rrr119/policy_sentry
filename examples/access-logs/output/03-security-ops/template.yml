mode: actions
name: 03-security-ops
actions:
- ec2:DescribeSecurityGroups
- ec2:DescribeVpcs
- iam:GetRole
- iam:ListRoles
- s3:GetBucketPolicy
- s3:PutBucketPolicy
- sns:Publish
resource-arns:
  iam:GetRole:
  - arn:aws:iam::123456789012:role/deploy-role
  s3:GetBucketPolicy:
  - arn:aws:s3:::acme-audit-logs
  s3:PutBucketPolicy:
  - arn:aws:s3:::acme-audit-logs
  sns:Publish:
  - arn:aws:sns:us-east-1:123456789012:security-alerts
